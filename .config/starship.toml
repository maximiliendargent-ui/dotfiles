# Prompt sobre, style Omarchy.
# Les couleurs utilisent les noms ANSI (blue, green, red...) : elles viennent donc
# de la palette de Ghostty, que Noctalia met à jour selon le fond d'écran.

add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "purple"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "yellow"
modified = "!"
untracked = "?"
staged = "+"
ahead = "⇡"
behind = "⇣"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bright-black"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
