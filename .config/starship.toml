# Prompt en deux lignes, style Omarchy enrichi.
# Les couleurs utilisent les noms ANSI (blue, green, red...) : elles viennent donc
# de la palette de Ghostty, que Noctalia met à jour selon le fond d'écran.

add_newline = true
format = "$os$directory$git_branch$git_status$python$nodejs$rust$lua$golang$docker_context$fill$cmd_duration$jobs$time$line_break$character"

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style) "

[os.symbols]
CachyOS = ""
Arch = ""

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "purple"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "yellow"
modified = "!"
untracked = "?"
staged = "+"
ahead = "⇡"
behind = "⇣"

# Langages : affichés seulement dans un projet qui les utilise
[python]
format = "[ $version( \\($virtualenv\\))]($style) "
style = "yellow"

[nodejs]
format = "[ $version]($style) "
style = "green"

[rust]
format = "[ $version]($style) "
style = "red"

[lua]
format = "[ $version]($style) "
style = "blue"

[golang]
format = "[ $version]($style) "
style = "cyan"

[docker_context]
format = "[ $context]($style) "
style = "blue"

# Partie droite de la première ligne
[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "yellow"

[jobs]
format = "[ $number]($style) "
style = "cyan"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%H:%M"
style = "bright-black"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
