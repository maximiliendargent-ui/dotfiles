[theme.templates.user.hyprland_borders]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/hyprland-borders.lua"
output_path = "$XDG_CONFIG_HOME/hypr/config/noctalia_colors.lua"
post_hook   = "hyprctl reload"

# Bordures de la session niri (niri recharge sa config tout seul)
[theme.templates.user.niri_borders]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/niri-borders.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia.kdl"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["ghostty", "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "qt"]

enable_community_templates = true
community_ids = ["vscode", "zen-browser", "pywalfox", "discord", "papirus-icons", "yazi"]

[shell.screenshot]
directory = "/home/maximilien/Pictures/Screenshots"
copy_to_clipboard = true
save_to_file = false
confirm_region = true

[wallpaper]
directory = "/home/maximilien/Pictures/Wallpapers"

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

[widget.claude]
type = "custom_button"
custom_image = "/home/maximilien/.config/noctalia/icons/claude.svg"
custom_image_colorize = true
tooltip = "Claude Code"

[widget.claude.actions]
left = "exec uwsm app -- ghostty --working-directory=/home/maximilien/.config -e /home/maximilien/.local/bin/claude"

# Moniteurs système dans la barre (placés dans [bar.default] de settings.toml)
[widget.gpu-temp]
type = "sysmon"
stat = "gpu_temp"
visualization = "none"
glyph = "temperature"

[widget.gpu]
type = "sysmon"
stat = "gpu_usage"
visualization = "graph"
glyph = "device-desktop-analytics"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "graph"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

[theme.templates.user.menu_colors]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/menu-colors.json"
output_path = "$XDG_CONFIG_HOME/quickshell/menu/colors.json"

# Couleurs et fond de la page d'accueil des navigateurs (~/.config/startpage/index.html)
[theme.templates.user.startpage_colors]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/startpage-colors.css"
output_path = "$XDG_CONFIG_HOME/startpage/colors.css"

# Disposition façon Caelestia (style inchangé, barre gardée en haut) : lanceur en bas,
# centre de contrôle en haut au centre, session en colonne en haut à droite, OSD vertical à droite
[shell.panel]
launcher_placement = "floating"
launcher_position = "bottom_center"
clipboard_placement = "floating"
clipboard_position = "bottom_center"
wallpaper_placement = "floating"
wallpaper_position = "bottom_center"
control_center_placement = "floating"
control_center_position = "top_center"
session_placement = "floating"
session_position = "top_right"

[shell.session]
grid = true
grid_columns = 1

[osd]
position = "center_right"
orientation = "vertical"
