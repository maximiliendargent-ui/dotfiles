[theme.templates.user.hyprland_borders]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/hyprland-borders.lua"
output_path = "$XDG_CONFIG_HOME/hypr/config/noctalia_colors.lua"
post_hook   = "hyprctl reload"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["ghostty", "btop", "gtk3", "gtk4", "kcolorscheme", "qt"]

enable_community_templates = true
community_ids = ["vscode", "zen-browser", "pywalfox"]

[shell.screenshot]
directory = "/home/maximilien/Pictures/Screenshots"
copy_to_clipboard = true
save_to_file = false
confirm_region = true

[wallpaper]
directory = "/home/maximilien/Pictures/Wallpapers"

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

[widget.claude]
type = "custom_button"
custom_image = "/home/maximilien/.config/noctalia/icons/claude.svg"
custom_image_colorize = true
tooltip = "Claude Code"

[widget.claude.actions]
left = "exec uwsm app -- ghostty -e claude"

[theme.templates.user.menu_colors]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/menu-colors.json"
output_path = "$XDG_CONFIG_HOME/quickshell/menu/colors.json"
