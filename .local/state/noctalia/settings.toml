config_version = 15

[bar.default]
background_opacity = 0.0
capsule = true
capsule_fill = "on_secondary"
center = [ "workspaces", "clock", "wallhaven", "claude", "widget" ]
color = "primary"
compositor_blur = false
end = []
font_weight = 800
icon_color = "primary"
margin_ends = 0
position = "left"
radius = 0
reserve_space = false
shadow = false
smart_auto_hide = true
start = []

[control_center]
hidden_tabs = [ "monitor", "power", "notifications" ]
show_session_button = false

    [[control_center.shortcuts]]
    type = "nightlight"

[dock]
enabled = false
launcher_position = "start"

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.69999999999999996
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@WAYLAND-1",
    "lockscreen-clock@HDMI-A-1",
    "lockscreen-weather@HDMI-A-1",
    "lockscreen-media@HDMI-A-1",
    "lockscreen-login-box@HDMI-A-1"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1"]
    box_height = 260.0
    box_width = 900.0
    cx = 960.0
    cy = 340.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1".settings]
        clock_style = "digital"
        color = "primary"

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 320.0
    cy = 178.0
    output = "WAYLAND-1"
    placement_height = 360.0
    placement_width = 640.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-media@HDMI-A-1"]
    box_height = 130.0
    box_width = 560.0
    cx = 960.0
    cy = 660.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

    [lockscreen_widgets.widget."lockscreen-weather@HDMI-A-1"]
    box_height = 90.0
    box_width = 420.0
    cx = 960.0
    cy = 520.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/maximilien/Videos/Wallpapers"

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
browser_position = "top_center"
download_dir = "/home/maximilien/Pictures/Wallpapers"

[plugin_settings."yuuto/arch-updater"]
panel_placement = "floating"
panel_position = "top_center"
update_mode = "background"

[plugins]
enabled = [ "noctalia/wallhaven", "yuuto/arch-updater" ]

[shell]
corner_radius_scale = 1.0
popup_shadows = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/maximilien/Pictures/Wallpapers/wallhaven-zxyy5w.png"

[wallpaper.last]
path = "/home/maximilien/Pictures/Wallpapers/wallhaven-zxyy5w.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/maximilien/Pictures/Wallpapers/wallhaven-zxyy5w.png"

[widget.session]
enabled = false

[widget.tray]
enabled = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "yuuto/arch-updater:widget"