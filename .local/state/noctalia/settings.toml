config_version = 14

[bar.default]
auto_hide = true
center = [ "clock", "cat" ]
color = "primary"
end = [ "claude", "notifications", "network", "bluetooth", "volume", "control-center", "session" ]
font_weight = 700
icon_color = "primary"
margin_ends = 0
radius = 0
reserve_space = true
shadow = false
start = [ "workspaces", "wallhaven" ]
thickness = 30

[dock]
launcher_position = "start"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 608.0
    cx = 320.0
    cy = 178.0
    output = "WAYLAND-1"
    placement_height = 360.0
    placement_width = 640.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/maximilien/Videos/Wallpapers"

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/maximilien/Pictures/Wallpapers"

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/wallhaven" ]

[shell]
corner_radius_scale = 0.0

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/maximilien/Pictures/Wallpapers/wallhaven-2ymdrg.jpg"

[wallpaper.last]
path = "/home/maximilien/Pictures/Wallpapers/wallhaven-2ymdrg.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/maximilien/Pictures/Wallpapers/wallhaven-2ymdrg.jpg"

[widget.cat]
audio_spectrum = true
font_scale = 0.79000000000000004
font_weight = 200
scale = 2.5
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.tray]
enabled = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"